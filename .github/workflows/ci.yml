# Keep this congruent with `Brewfile` (the LLVM that bpf-linker needs).
name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly, for the datapath suite below — it needs root and a real kernel,
    # so it is not something to put in front of a merge.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The one job that needs more (fabric's image
# push) asks for it on the job itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast lane: the std-testable crates (logic, config, gRPC). No eBPF toolchain,
  # no root — this gate runs in seconds and catches most regressions. `protoc`
  # is needed to compile the controller's `.proto`.
  logic:
    name: host crates — fmt, clippy, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: rustfmt
        run: cargo fmt --all -- --check
      # Exclude `velstra-ebpf` (BPF-only, no host std) and `velstra` (the agent,
      # whose build script needs bpf-linker — covered by the `build` job). The
      # rest is the host control plane: common/config/proto/controller/cni/
      # orchestrator/raft.
      - name: clippy (host crates)
        run: cargo clippy --workspace --exclude velstra-ebpf --exclude velstra --all-targets --locked -- -D warnings
      - name: test (host crates)
        run: cargo test --workspace --exclude velstra-ebpf --exclude velstra --locked
      # The end-to-end suite is shell, and shell fails at runtime or not at all.
      # `--severity=error` only: these scripts are clean at that level today.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

  # Full lane: builds the eBPF data plane (needs nightly rust-src + bpf-linker)
  # and the control plane, then runs the control-plane tests.
  build:
    name: ebpf + control plane — build & test
    if: github.event_name != 'schedule'
    # Pinned to match the images' `ubuntu:24.04` base: the COPY-prebuilt binaries
    # are dynamically linked against the runner's glibc, so runner == image base.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # `rust-src` is required to cross-compile std for the BPF target;
          # clippy lints the host control-plane crate.
          components: rust-src, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked
      - name: clippy (control plane)
        # The eBPF crate is only ever built for the bpf target via the app's
        # build script, so it is intentionally excluded from host clippy
        # (it is `no_std`/`no_main` and cannot link against the host std).
        run: cargo clippy -p velstra --all-targets --locked -- -D warnings
      - name: Build (release, embeds the eBPF object)
        run: cargo build --release --locked
      - name: Test control plane
        run: cargo test -p velstra --locked
      - name: Smoke-test the agent CLI (no root needed)
        run: |
          # Agent-side policy files only; topology.toml is a controller file.
          for cfg in examples/rules.toml examples/loadbalancer.toml \
                     examples/multitenant.toml examples/router.toml examples/overlay.toml; do
            ./target/release/velstra validate "$cfg"
          done
      # NOTE: the `cargo build --release` step above is what gates the eBPF data
      # plane — velstra-app's build.rs cross-compiles `velstra-ebpf` for the BPF
      # target via aya-build, so a data-plane compile error fails this job (on
      # PRs too). What it does not prove is that the loaded programs *do*
      # anything: that is the `datapath` job at the bottom of this file, which
      # needs root and therefore runs nightly rather than here.
      # Hand the freshly-built binaries to the `images` job so it doesn't repeat
      # the (slow) eBPF release build. Only on push — PRs don't publish.
      - name: Upload release binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: velstra-binaries
          path: |
            target/release/velstra
            target/release/velstra-controller
            target/release/velstra-cni
          retention-days: 1
          if-no-files-found: error

  # Root/KVM lane: the eBPF verifier acceptance (tests/e2e/loadcheck.sh). GitHub's
  # ubuntu-latest runners now grant passwordless sudo and a real kernel, so the
  # ~2-second "does the datapath load at all" check — the acceptance for the whole
  # stack-discipline rework — can gate every PR instead of only running on a
  # developer box. It loads the real XDP program into the runner's OWN kernel
  # (root, not a nested guest), so it needs no /dev/kvm.
  #
  # The heavier full datapath suite (tests/e2e/run.sh, netns/veth topologies) stays
  # the nightly `datapath` job below on purpose: its per-runner kernel-load
  # behaviour is still unproven, and a kernel-loading suite is the wrong thing to
  # put between a maintainer and a merge. This loadcheck is precisely the probe
  # that will tell us whether promoting the rest is safe — the first green run here
  # is evidence the hosted kernel accepts these programs at all.
  loadcheck:
    name: ebpf verifier load-check (root)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # `rust-src` cross-compiles std for the BPF target (via the app's
          # build.rs); no clippy needed here, the host lanes cover that.
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and iproute2
        # protoc: velstra-proto's build. iproute2: loadcheck.sh's `ip link`.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler iproute2
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked
      - name: Say what kernel this is
        # The verifier's verdict depends on it, so a failure that does not name the
        # kernel is a failure nobody can act on (same rationale as `datapath`).
        run: |
          uname -a
          grep -E "^BPF|BPF_SYSCALL|^CONFIG_XDP" /boot/config-"$(uname -r)" 2>/dev/null || true
      - name: Build the agent (release, embeds the eBPF object via build.rs)
        run: cargo build --release --locked -p velstra
      - name: Load-check (root) — the verifier must accept the datapath
        # `-E` keeps the invoking env (PATH, CARGO_*); the script finds the tree
        # from its own path, so it needs no VELSTRA_ROOT here.
        run: sudo -E ./tests/e2e/loadcheck.sh

  # Build the three container images from the binaries the `build` job produced
  # and push them to GHCR. Runs only on a push to the default branch or a version
  # tag — never on pull requests (which can't access the registry token anyway).
  images:
    name: container images — build & push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          name: velstra-binaries
          path: target/release
      - name: Restore the executable bit
        run: chmod +x target/release/velstra target/release/velstra-controller target/release/velstra-cni
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (controller, agent, cni)
        run: |
          set -eu
          # GHCR requires a lowercase owner; the SHA is always a tag, plus
          # `latest` on the default branch and the tag name on a version tag.
          REGISTRY="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${GITHUB_SHA:0:7}"
          for c in controller agent cni; do
            TAGS="-t ${REGISTRY}/${c}:${SHA_TAG}"
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/master) TAGS="${TAGS} -t ${REGISTRY}/${c}:latest" ;;
              refs/tags/*)                       TAGS="${TAGS} -t ${REGISTRY}/${c}:${GITHUB_REF_NAME}" ;;
            esac
            echo "building ${c}: ${TAGS}"
            docker buildx build --push -f "deploy/docker/Dockerfile.${c}" ${TAGS} .
          done

  # The datapath itself: `tests/e2e/run.sh` loads the real XDP and TC programs
  # into throwaway netns/veth topologies and asserts on what the kernel then does
  # with the packets. Everything above it proves the code compiles and the
  # host-side logic is right; only this proves the firewall filters.
  #
  # Nightly rather than per-PR because it wants root — a hosted runner grants
  # that through passwordless sudo, so the privilege is not the obstacle the
  # older comment in this file suggested; the obstacle is that a kernel-loading
  # suite is the wrong thing to put between a maintainer and a merge.
  #
  # HONESTY NOTE: this job has never run on GitHub's runners. It runs locally on
  # a developer box with `make e2e`. What is unproven here is whether the hosted
  # kernel loads these programs — the verifier is version-sensitive, and the
  # runner's kernel is not the one this is developed against. If it turns out it
  # cannot, the fix is a self-hosted runner with `runs-on: [self-hosted, linux,
  # ebpf]`, not deleting the job: the first nightly failure is information.
  datapath:
    name: e2e datapath (nightly, needs root)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and iproute2
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler iproute2 ethtool iputils-arping
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked
      - name: Say what kernel this is
        # The verifier's answer depends on it, so a failure report that does not
        # name the kernel is a failure report nobody can act on.
        run: |
          uname -a
          grep -E "^BPF|BPF_SYSCALL|^CONFIG_XDP" /boot/config-"$(uname -r)" 2>/dev/null || true
      - name: Build the agent (release, embeds the eBPF object)
        run: cargo build --release --locked
      - name: Run the end-to-end datapath suite
        run: sudo -E ./tests/e2e/run.sh
