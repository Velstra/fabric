[package]
name = "velstra-controller"
version = "0.4.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "velstra-controller"
path = "src/main.rs"

[dependencies]
velstra-common = { path = "../velstra-common" }
velstra-config = { path = "../velstra-config" }
velstra-orchestrator = { path = "../velstra-orchestrator" }
velstra-proto = { path = "../velstra-proto" }
velstra-raft = { path = "../velstra-raft" }

anyhow = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
x509-parser = "0.16"
toml = { workspace = true, features = ["display"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs", "net", "io-util"] }
# `sync` brings BroadcastStream, which turns the audit broadcast into the
# /v1/events SSE stream.
tokio-stream = { workspace = true, features = ["sync"] }
# REST/JSON northbound gateway (D1). axum 0.7 shares hyper 1 / http 1
# with the tonic gRPC stack already in the tree, so no duplicate HTTP runtime.
axum = { version = "0.7", default-features = true }
serde_json = { workspace = true }

# Native TLS for the REST northbound gateway. Reuses the rustls/ring stack the
# tonic gRPC server already pulls in (no aws-lc-rs, no cmake in the closure):
# axum-server's `tls-rustls-no-provider` lets us hand it a `ServerConfig` we build
# with the ring provider ourselves. rustls-pemfile parses the same PEM files the
# gRPC channel uses; rustls builds the server identity + optional client-CA
# verifier (transport-level mTLS when --client-ca is set).
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

# HTTP client for webhook delivery (D1) and the REST integration tests. rustls
# rather than native TLS: the tonic stack already brings rustls, so an https
# webhook endpoint costs no second TLS implementation.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
] }
