# Example Velstra fabric topology (Track C).
#
# This single file declares the whole virtual fabric — hosts (VTEPs), networks
# (tenants), and ports (VM NICs). The controller derives each host's concrete
# config from it and serves it to that node:
#
#   velstra-controller serve --topology examples/topology.toml
#
# Two hosts, one tenant network spanning both. The orchestrator automatically:
#   * binds each port's tap to its network's policy + VNI on the right host,
#   * creates a tunnel + ARP entry on each host for the *other* host's port,
#   * allocates IPs/MACs for ports that don't pin one.

[[host]]
id             = "host-1"
vtep           = "10.10.0.1"          # underlay VTEP address
underlay_iface = "eth0"
underlay_mac   = "02:00:00:00:00:11"
# encap = "vxlan"   # or "geneve"; default vxlan
# underlay_mtu = 1500

[[host]]
id             = "host-2"
vtep           = "10.10.0.2"
underlay_iface = "eth0"
underlay_mac   = "02:00:00:00:00:22"

[[network]]
vni            = 5000
name           = "blue"
subnet         = "192.168.100.0/24"   # IPAM allocates port addresses from here
default_action = "pass"
# drop_icmp = false

# A VM NIC on host-1. Omit `ip` to auto-allocate the next free address.
[[port]]
network = 5000
host    = "host-1"
tap     = "tap-blue-1"
ip      = "192.168.100.10"

# A VM NIC for the same tenant, on host-2.
[[port]]
network = 5000
host    = "host-2"
tap     = "tap-blue-2"
ip      = "192.168.100.20"

# --- Beyond the basics -------------------------------------------------------
#
# Everything below is optional. See docs/CONFIGURATION.md for the full reference.

# A reusable rule set. Ports bind it by name; it gets a stable policy id of its
# own, decoupled from the VNI.
[[security_group]]
name           = "web"
default_action = "drop"
stateful       = true

[[security_group.rule]]
proto  = "tcp"
port   = 443
action = "pass"

# A second segment for the same tenant, so there is something to route between.
[[network]]
vni    = 5001
name   = "blue-db"
subnet = "192.168.101.0/24"

[[port]]
network        = 5001
host           = "host-1"
tap            = "tap-db-1"
ip             = "192.168.101.10"
security_group = "web"

# The tenant's routed context (B7): traffic between 5000 and 5001 is *routed*
# behind one anycast gateway, not bridged. The remote prefixes themselves are
# learned over BGP EVPN — only the context is declared here.
[[ip_vrf]]
l3_vni      = 50100
name        = "tenant-a"
gateway_mac = "02:00:5e:00:00:aa"     # identical on every host of this tenant
networks    = [5000, 5001]

# A VIP fronting a pool of ports, DNAT-rewritten in XDP at the ingress host.
# A member names its port by host+tap — the way this file names ports.
[[load_balancer]]
id    = "web-vip"
vni   = 5000
vip   = "192.168.100.200"
port  = 80
proto = "tcp"

[[load_balancer.member]]
host = "host-1"
tap  = "tap-blue-1"
port = 8080

[[load_balancer.member]]
host = "host-2"
tap  = "tap-blue-2"
port = 8080
