[package]
name = "velstra-ebpf"
version = "0.2.0"
edition.workspace = true
# GPL/MIT: this crate compiles to the in-kernel eBPF object, which must be
# GPL-compatible to call GPL-only BPF helpers (see the LICENSE marker in main.rs).
license = "GPL-2.0-or-later OR MIT"

[dependencies]
velstra-common = { path = "../velstra-common" }

aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }
network-types.workspace = true

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "velstra"
path = "src/main.rs"
# This is a kernel entry point, not a host executable or libtest harness.
# Its packet/verifier tests run through the actual Linux BPF VM checks.
test = false
bench = false
