[package]
name = "velstra"
version = "0.4.1"
edition.workspace = true

license.workspace = true

[package.metadata.velstra]
persistent-datapath = true

[dependencies]
serde_json = { workspace = true }
velstra-common = { path = "../velstra-common", features = ["user"] }
velstra-config = { path = "../velstra-config" }
velstra-proto = { path = "../velstra-proto" }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
] }
clap = { workspace = true, features = ["derive"] }
tonic = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
velstra-common = { path = "../velstra-common", features = ["user"] }

[build-dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
# Keep the library dependency for Cargo invalidation while build.rs compiles
# the binary using the checked-in atomic BPF target and pinned nightly. Artifact
# dependencies cannot yet express its build-std requirement on stable Cargo.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
velstra-ebpf = { path = "../velstra-ebpf" }

[[bin]]
name = "velstra"
path = "src/main.rs"
